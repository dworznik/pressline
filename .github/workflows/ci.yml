name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: format · lint · typecheck · adr · architecture · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check
      - run: pnpm adr:check
      - run: pnpm architecture:check
      - run: pnpm test
      - run: pnpm build

  platform-builds:
    name: build for cloudflare and vercel
    runs-on: ubuntu-latest
    strategy:
      matrix:
        adapter: [cloudflare, vercel]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pressline/contract --filter @pressline/render build
      - run: pnpm --filter pressline --filter pressline-sample-engine build
        env:
          PRESSLINE_ADAPTER: ${{ matrix.adapter }}
      # The Cloudflare bundle must not carry the native SQLite driver (ADR-0008): the
      # adapter's _worker.js only re-exports the server output, so look at the chunks.
      - run: '! grep -rl better-sqlite3 apps/pressline/.svelte-kit/output/server'
        if: matrix.adapter == 'cloudflare'

  e2e:
    name: storefront e2e (playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/pressline
      - run: pnpm e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/pressline/test-results
          retention-days: 7

  secrets-scan:
    name: secrets scan (gitleaks)
    runs-on: ubuntu-latest
    # Open-source repo: no Printful/Stripe/Resend key may ever land in history.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # The only check `main` requires. Branch protection matches contexts by job
  # name, so requiring the jobs above would pin their names: renaming one (as
  # #73 renamed `checks` when it gained architecture:check) would leave a
  # required name nothing reports, and every PR would wait on it forever.
  # Adding a job to `needs` is what enrolls it in the gate.
  ci-ok:
    name: ci-ok
    # Without always() an upstream failure skips this job, and GitHub counts a
    # skipped required check as passing — the gate would open when it must close.
    if: always()
    needs: [checks, platform-builds, e2e, secrets-scan]
    runs-on: ubuntu-latest
    steps:
      - name: every job this gate depends on succeeded
        # Through env rather than interpolated into the script: expressions are
        # substituted as text before the shell parses it.
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "::error::a required job did not succeed: $result"
              exit 1
            fi
          done
