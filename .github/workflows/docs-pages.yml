name: docs-pages

# Publishes apps/docs to GitHub Pages (https://dworznik.github.io/pressline)
# on every push to main. pressline.dev can point at the same deployment
# later by setting a custom domain on the Pages settings and dropping DOCS_BASE.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: docs-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pressline/contract build
      - run: pnpm --filter pressline-docs build
        env:
          DOCS_SITE: https://dworznik.github.io
          DOCS_BASE: /pressline
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
