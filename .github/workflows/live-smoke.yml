name: live-smoke

# Nightly (ticket #25): the real adapters against Printful (drafts only, never
# confirmed, deleted after costing) and Stripe test mode (a session created
# and expired). Spends no money. Skipped on forks and when the secrets are
# absent. A failure opens (or updates) an issue so maintainers learn within a
# day that an API changed shape.
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  smoke:
    if: github.repository == 'dworznik/pressline'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @pressline/contract build
      - name: Live smoke
        id: smoke
        if: ${{ env.PRINTFUL_TOKEN != '' && env.STRIPE_SECRET_KEY != '' }}
        env:
          PRINTFUL_TOKEN: ${{ secrets.PRINTFUL_TOKEN }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_TEST_SECRET_KEY }}
          SMOKE_PRINTFILE_URL: ${{ vars.SMOKE_PRINTFILE_URL }}
        run: pnpm --filter pressline test:live
      - name: Notify maintainers
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Live smoke failed on $(date -u +%F)"
          existing=$(gh issue list --label live-smoke --state open --json number --jq '.[0].number')
          body="The nightly live smoke failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$existing" ]; then gh issue comment "$existing" --body "$body"; else gh issue create --title "$title" --label live-smoke --body "$body"; fi
