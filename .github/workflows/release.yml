name: release

on:
  # Merging to main is the trigger. Almost every push has nothing to publish and
  # the job stops at the gate below; a merged version bump is what ships.
  push:
    branches: [main]
  # A pull request that bumps the versions rehearses its own publish, so the
  # answer to "will this actually go out?" arrives before it is merged.
  pull_request:
    branches: [main]
  workflow_dispatch:

# One publish at a time, never cancelled part-way: some packages would be on the
# registry and the rest would not. Keyed by ref so a rehearsal on a branch cannot
# hold up main.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write # to tag what was published
  # npm trusted publishing: pnpm exchanges this OIDC token for a short-lived
  # registry token per package. There is no NPM_TOKEN, by design.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # No dependency cache here: a release should build from what the
          # lockfile says, not from whatever a previous run left behind.

      # Fails if the packages disagree on a version; otherwise reports which of
      # them the registry is missing. Everything below is skipped when it is none,
      # which is the usual answer -- and the reason running on every push is cheap.
      - name: what is there to publish
        id: status
        run: node scripts/release-status.mjs >> "$GITHUB_OUTPUT"

      - if: steps.status.outputs.pending != ''
        run: pnpm install --frozen-lockfile

      # Only on the way out. A pull request has already had this from ci.yml.
      - if: github.event_name == 'push' && steps.status.outputs.pending != ''
        run: pnpm verify

      # A trusted publisher is configured per package on npmjs.com, and nothing in
      # this repository can see whether that was done -- so a bump proves it here,
      # on the pull request, rather than discovering it half-published on main.
      # pnpm builds its publish options, the OIDC token exchange included, before
      # it honors --dry-run: this authenticates for real and publishes nothing.
      #
      # A fork never gets an id-token, so skip it there rather than fail on it.
      - name: rehearse the publish
        if: |
          github.event_name != 'push' && steps.status.outputs.pending != '' &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          set -o pipefail
          pnpm --recursive publish --dry-run --no-git-checks 2>&1 | tee dry-run.log

          # pnpm only warns when the token exchange fails and falls back to whatever
          # credential it can find -- of which this job has none. Treat it as fatal:
          # merging this would fail part-way through the dependency order.
          if grep -qF 'Skipped OIDC' dry-run.log; then
            echo "::error::A package is missing its trusted publisher on npmjs.com. Configure it against this repository and release.yml before merging."
            exit 1
          fi

          echo "Trusted publishing authenticated for every package. Merging this publishes ${{ steps.status.outputs.version }}."

      # Publishes every non-private workspace package whose version is not on the
      # registry yet, in dependency order, rewriting `workspace:^` to a real range.
      # --no-git-checks because the publish branch default is master.
      # Do not add --batch: it turns OIDC off and the publish would go unauthenticated.
      - name: publish
        if: github.event_name == 'push' && steps.status.outputs.pending != ''
        run: pnpm --recursive publish --no-git-checks

      # The tag is the record of what went out, written after the fact because the
      # registry, not the tag, decided what shipped.
      - name: tag the release
        if: github.event_name == 'push' && steps.status.outputs.pending != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.status.outputs.version }}
          PUBLISHED: ${{ steps.status.outputs.pending }}
        run: |
          # A re-run after a partly failed publish finishes the job and arrives
          # here with the tag already written. That is success, not a conflict.
          if gh release view "v${VERSION}" >/dev/null 2>&1; then
            echo "v${VERSION} is already tagged; leaving it alone."
            exit 0
          fi
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes "Published to npm from ${GITHUB_SHA}: ${PUBLISHED//,/, }" \
            --target "${GITHUB_SHA}"
