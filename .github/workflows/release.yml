name: release

on:
  # Publishing the GitHub Release is the trigger: draft it, click Publish, npm follows.
  release:
    types: [published]
  # Run by hand to rehearse a release. This never publishes; see the dry run below.
  workflow_dispatch:

# Never let two releases publish at once, and never cancel one part-way: some
# packages would be on the registry and the rest would not.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read
  # npm trusted publishing: pnpm exchanges this OIDC token for a short-lived
  # registry token per package. There is no NPM_TOKEN, by design.
  id-token: write

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          # No dependency cache here: a release should build from what the
          # lockfile says, not from whatever a previous run left behind.

      - run: pnpm install --frozen-lockfile

      # The tag names a version; package.json decides what actually ships. Stop
      # before publishing if they disagree.
      - name: tag matches package versions
        if: github.event_name == 'release'
        run: node scripts/check-release-tag.mjs "${{ github.event.release.tag_name }}"

      - run: pnpm verify

      # A trusted publisher is configured per package on npmjs.com, and nothing in
      # this repository can see whether that was done. pnpm builds its publish
      # options -- including the OIDC token exchange -- before it honors --dry-run,
      # so this rehearses the authentication for real and publishes nothing.
      - name: rehearse the publish
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -o pipefail
          pnpm --recursive publish --dry-run --no-git-checks 2>&1 | tee dry-run.log

          if grep -qF 'There are no new packages that should be published' dry-run.log; then
            echo "::error::Every version in packages/* is already on the registry, so nothing exercised trusted publishing. Bump the four versions on main, then run this again."
            exit 1
          fi

          # pnpm only warns when the token exchange fails and falls back to whatever
          # credential it can find -- of which this job has none. Treat it as fatal:
          # a real release would fail here, part-way through the dependency order.
          if grep -qF 'Skipped OIDC' dry-run.log; then
            echo "::error::A package is missing its trusted publisher on npmjs.com. Configure it against this repository and release.yml, then run this again."
            exit 1
          fi

          echo 'Trusted publishing authenticated for every package. A release will publish cleanly.'

      # Publishes every non-private workspace package whose version is not on the
      # registry yet, in dependency order, rewriting `workspace:^` to a real range.
      # --no-git-checks because a release builds from a detached tag checkout.
      # Do not add --batch: it turns OIDC off and the publish would go unauthenticated.
      - name: publish
        if: github.event_name == 'release'
        run: pnpm --recursive publish --no-git-checks
