# Gitleaks configuration: the default rules, plus an allowlist for test
# fixtures. Tests sign requests with fixed, obviously fake keys and replay
# recorded provider responses; those files never hold real credentials.
[extend]
useDefault = true

[allowlist]
description = "Test fixtures and adapter tests use fake keys by design"
paths = [
  '''apps/[^/]+/tests/.*''',
  '''packages/[^/]+/tests/.*''',
]
