packages:
  - 'apps/*'
  - 'packages/*'

# Native/postinstall builds are opt-in. sharp is needed by @pressline/render's
# node backend; workerd by the Cloudflare dev server. Everything else stays off.
allowBuilds:
  esbuild: true
  sharp: true
  workerd: true
  better-sqlite3: true
  fsevents: false
  core-js: false
  msgpackr-extract: false

minimumReleaseAgeExclude:
  - lint-staged@17.5.1
  - vite@8.3.0
